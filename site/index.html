<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PixelEngine Feedback Log</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="page">
    <header class="hero">
      <p class="eyebrow">PixelEngine</p>
      <h1>Engine Feedback Log</h1>
      <p class="subtitle">개인 엔진 개발 과정에서 쌓은 피드백, 결정, 일감화 기록.</p>
      <p class="updated" id="updated"></p>
    </header>

    <section class="stats" id="stats"></section>

    <section class="filters">
      <label>
        검색
        <input id="search" type="search" placeholder="제목, 문제, 제안 검색">
      </label>
      <label>
        영역
        <select id="areaFilter"></select>
      </label>
      <label>
        상태
        <select id="statusFilter"></select>
      </label>
    </section>

    <section class="content">
      <aside class="list" id="list"></aside>
      <article class="detail" id="detail">
        <div class="empty">피드백을 선택하세요.</div>
      </article>
    </section>
  </main>
  <script src="./app.js"></script>
</body>
</html>
