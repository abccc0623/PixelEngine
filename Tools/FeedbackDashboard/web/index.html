<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PixelEngine Feedback</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <p class="eyebrow">PixelEngine</p>
        <h1>Engine Feedback</h1>
      </div>
      <div class="date" id="today"></div>
    </header>

    <section class="stats" id="stats"></section>

    <section class="layout">
      <aside class="list-panel">
        <div class="filters">
          <button class="filter active" data-filter="all">전체</button>
          <button class="filter" data-filter="미검토">미검토</button>
          <button class="filter" data-filter="일감화">일감화</button>
          <button class="filter" data-filter="폐기">폐기</button>
        </div>
        <div class="feedback-list" id="feedbackList"></div>
      </aside>

      <section class="detail-panel" id="detailPanel">
        <div class="empty">피드백을 선택해줘.</div>
      </section>
    </section>
  </main>
  <script src="./app.js"></script>
</body>
</html>
