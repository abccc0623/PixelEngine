name: Daily Engine Feedback

on:
  schedule:
    # 10:00 KST
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      feedback_date:
        description: "Optional date override, for example 2026-06-20"
        required: false
        type: string

permissions:
  contents: write

jobs:
  generate-feedback:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate feedback
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1-mini' }}
          FEEDBACK_DATE: ${{ inputs.feedback_date }}
        run: python Tools/FeedbackDashboard/generate_feedback.py

      - name: Commit generated feedback
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Docs/EngineFeedback
          if git diff --cached --quiet; then
            echo "No feedback changes to commit."
          else
            git commit -m "Add daily engine feedback"
            git push
          fi
